[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-budget-gateway"
version = "0.1.0"
description = "OpenAI-compatible proxy with tier aliases, price ceilings, a daily budget, free-model rotation and one-shot outage failover."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
